# Release fanout when a tag like `fanout/v0.1.0` is pushed.
# The tag is prefixed because fanout is a Go module in a subdirectory: Go
# resolves `github.com/kingchan818/agent-tools/fanout@v0.1.0` to the tag
# `fanout/v0.1.0`.
name: release-fanout

on:
  push:
    tags: ["fanout/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fanout
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: fanout/go.mod
          cache: false

      - name: Test
        run: go vet ./... && go test -race ./...

      - name: Check the tag matches cli.Version
        run: |
          want="fanout ${GITHUB_REF_NAME#fanout/v}"
          got="$(go run ./cmd/fanout version)"
          if [ "$got" != "$want" ]; then
            echo "::error::tag says '$want' but the binary says '$got'; bump Version in internal/cli/cli.go"
            exit 1
          fi

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#fanout/v}"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}" arch="${target#*/}"
            name="fanout_${version}_${os}_${arch}"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "dist/$name/fanout" ./cmd/fanout
            cp README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
            --title "fanout v${GITHUB_REF_NAME#fanout/v}" \
            --generate-notes --verify-tag
